<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155eef">
  <title>You're offline · QuickChat</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9fc;color:#172033;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:32px 26px;border:1px solid #e4eaf2;border-radius:24px;background:#fff;text-align:center;box-shadow:0 18px 55px rgba(20,40,80,.08)}
    .mark{width:64px;height:64px;margin:0 auto 20px;border-radius:20px;display:grid;place-items:center;background:#155eef;color:white;font-size:27px;font-weight:800}
    h1{margin:0 0 8px;font-size:23px;letter-spacing:-.5px}p{margin:0;color:#667085;font-size:14px}
    button{margin-top:24px;border:0;border-radius:12px;background:#155eef;color:white;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer}
    .hint{margin-top:14px;font-size:12px;color:#98a2b3}
  </style>
</head>
<body>
  <main>
    <div class="mark">Q</div>
    <h1>You're offline</h1>
    <p>QuickChat can't connect right now. Check your internet connection. Your app will be ready when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">Your account and messages are safe. Online features need an internet connection.</p>
  </main>
</body>
</html>
